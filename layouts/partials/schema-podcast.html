<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "PodcastSeries",
  "name": {{ .Site.Params.podcastTitle | jsonify | safeJS }},
  "url": "{{ .Site.BaseURL }}",
  "description": {{ .Site.Params.description | jsonify | safeJS }},
  "inLanguage": "it",
  "image": "{{ .Site.Params.podcastImage | absURL }}",
  "author": [
    {
      "@type": "Person",
      "name": "Filippo Strozzi",
      "url": "https://www.avvocati-e-mac.it"
    },
    {
      "@type": "Person",
      "name": "Roberto Marin",
      "url": "https://youtube.com/@architecday"
    }
  ],
  {{/* Solo la sezione episodi: len .Site.RegularPages contava anche ospiti e about,
       gonfiando il dato dichiarato a Google. */}}
  "numberOfEpisodes": {{ len (where .Site.RegularPages "Section" "episodi") }},
  "webFeed": {
    "@type": "DataFeed",
    "url": "{{ .Site.Params.podcastFeedUrl }}"
  }
}
</script>
