<header class="site-header">
  <div class="page-wrapper site-header-inner">
    <a href="{{ "/" | relURL }}" class="site-logo" aria-label="A2 Podcast — torna alla home">
      <span class="site-logo-mark">A2</span>
      <span class="site-logo-text">Podcast</span>
    </a>
    <nav class="site-nav" aria-label="Navigazione principale">
      <a href="{{ "/episodi/" | relURL }}"{{ if eq .Section "episodi" }} aria-current="page"{{ end }}>Episodi</a>
      <a href="{{ "/ospiti/" | relURL }}"{{ if eq .Section "ospiti" }} aria-current="page"{{ end }}>Ospiti</a>
      <a href="{{ "/about/" | relURL }}"{{ if eq .RelPermalink "/about/" }} aria-current="page"{{ end }}>Chi siamo</a>
      <a href="{{ .Site.Params.podcastFeedUrl }}" class="nav-subscribe btn btn-sm" target="_blank" rel="noopener" aria-label="Feed RSS del podcast">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="6.18" cy="17.82" r="2.18"/>
          <path d="M4 4.44v2.83c7.03 0 12.73 5.7 12.73 12.73h2.83c0-8.59-6.97-15.56-15.56-15.56zm0 5.66v2.83c3.9 0 7.07 3.17 7.07 7.07h2.83c0-5.47-4.43-9.9-9.9-9.9z"/>
        </svg>
      </a>
    </nav>
  </div>
</header>
