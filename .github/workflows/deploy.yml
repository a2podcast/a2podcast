name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '5 4 * * *'
    - cron: '5 5 * * *'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Schedule guard
        id: schedule_guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_time="$(TZ=Europe/Rome date +%H:%M)"
          if [ "$local_time" = "06:05" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled run at Europe/Rome local time $local_time"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: steps.schedule_guard.outputs.proceed == 'true'

      - name: Setup Hugo
        if: steps.schedule_guard.outputs.proceed == 'true'
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f  # v3.0.0
        with:
          hugo-version: '0.160.0'
          extended: false

      - name: Build
        if: steps.schedule_guard.outputs.proceed == 'true'
        run: hugo --gc --minify

      - name: Deploy to Cloudflare Pages
        if: steps.schedule_guard.outputs.proceed == 'true'
        run: npx wrangler pages deploy public --project-name a2podcast --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
